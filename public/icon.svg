<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft shadow -->
    <filter id="vrcShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#b91c1c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Clean Pure White Rounded Background -->
  <rect width="512" height="512" rx="100" fill="#ffffff" />
  <rect x="8" y="8" width="496" height="496" rx="92" fill="none" stroke="#e2e8f0" stroke-width="6"/>

  <!-- Official VRC Red Oval Brand Ring -->
  <g filter="url(#vrcShadow)">
    <ellipse cx="256" cy="235" rx="205" ry="145" fill="none" stroke="#D32F2F" stroke-width="17" />
  </g>

  <!-- Authentic VRC Typography in Official Red with Classic Heavy Serif -->
  <text 
    x="256" 
    y="280" 
    text-anchor="middle" 
    fill="#D32F2F" 
    font-family="'Times New Roman', 'Playfair Display', Georgia, serif" 
    font-size="142" 
    font-weight="900" 
    letter-spacing="7">VRC</text>

  <!-- Accent Divider Bar -->
  <rect x="96" y="405" width="320" height="4" rx="2" fill="#D32F2F" />

  <!-- Subtitle: MACHINERIES • P&M DEPARTMENT -->
  <text 
    x="256" 
    y="442" 
    text-anchor="middle" 
    fill="#1e293b" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="24" 
    font-weight="900" 
    letter-spacing="5">MACHINERIES</text>

  <text 
    x="256" 
    y="472" 
    text-anchor="middle" 
    fill="#64748b" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="16" 
    font-weight="700" 
    letter-spacing="3">P&amp;M DEPARTMENT</text>
</svg>
